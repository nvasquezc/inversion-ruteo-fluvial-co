name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Entorno (con extras geo y notebook)
        run: uv sync --all-extras
      - name: Estilo (ruff)
        run: uv run ruff check .
      - name: Pruebas
        run: uv run pytest -q
