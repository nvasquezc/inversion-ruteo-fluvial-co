name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Entorno (CPU, con extras geo y notebook)
        run: uv sync --all-extras
      - name: Estilo (ruff)
        run: uv run ruff check .
      - name: Pruebas (conservación de masa, gradientes, resolución, anidamiento)
        run: uv run pytest -q
