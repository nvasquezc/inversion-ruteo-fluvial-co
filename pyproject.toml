[project]
name = "ruteo-inverso"
version = "0.1.0"
description = "Inversión de parámetros de ruteo fluvial con operador diferenciable conservativo, análisis de resolución y diseño de redes hidrométricas para Colombia"
readme = "README.md"
authors = [
    { name = "Néstor Oswaldo Vásquez Castro" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[project.urls]
Repository = "https://github.com/nvasquezc/inversion-ruteo-fluvial-co"
Changelog = "https://github.com/nvasquezc/inversion-ruteo-fluvial-co/blob/main/CHANGELOG.md"

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
geo = [
    "geopandas>=1.2.0",
    "pyogrio>=0.13.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: celdas de markdown largas en scripts/construir_notebook.py
# E741: I, O son la notación estándar de entrada/salida en Muskingum–Cunge
# B905: los zip son de longitudes iguales por construcción
ignore = ["E501", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E402", "E731"]
